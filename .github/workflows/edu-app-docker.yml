name: ChatBotEducativo CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "ai-service/**"
      - "mcp-server/**"
      - "infrastructure/**"
      - ".github/workflows/edu-app-docker.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build edu-app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/Dockerfile.edu-app
          push: false
          tags: edu-app:latest
          build-args: |
            NEXT_PUBLIC_EDU_BASE_PATH=/edu-chat
            NEXT_PUBLIC_API_URL=https://iecacampus.arcadevs.cloud/api/edu-chat-proxy
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify VPS_SSH_KEY (sin passphrase)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::Falta VPS_SSH_KEY. Configura organization secret o repo secret."
            exit 1
          fi
          printf '%s' "$VPS_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          if ! ssh-keygen -y -f /tmp/deploy_key -P "" >/dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY tiene passphrase o formato invalido."
            echo "::error::Usa la misma llave SIN passphrase que campusdemo."
            echo "::error::Ver infrastructure/GITHUB-SECRETS.md"
            exit 1
          fi
          echo "VPS_SSH_KEY OK"
          rm -f /tmp/deploy_key

      - name: Copy repo to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          source: "backend,frontend,ai-service,mcp-server,infrastructure"
          target: ${{ secrets.VPS_DEPLOY_PATH_EDU }}

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 30m
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH_EDU }}/infrastructure
            if [ ! -f .env.prod ]; then
              cp .env.prod.example .env.prod
            fi
            docker compose --env-file .env.prod -f docker-compose.prod-internal.yml up -d --build
