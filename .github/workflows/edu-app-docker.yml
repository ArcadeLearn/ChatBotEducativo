name: ChatBotEducativo CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "ai-service/**"
      - "mcp-server/**"
      - "infrastructure/**"
      - ".github/workflows/edu-app-docker.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build edu-app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/Dockerfile.edu-app
          push: false
          tags: edu-app:latest
          build-args: |
            NEXT_PUBLIC_EDU_BASE_PATH=/edu-chat
            NEXT_PUBLIC_API_URL=https://iecacampus.arcadevs.cloud/api/edu-chat-proxy
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          known_hosts: ${{ secrets.VPS_HOST }}

      - name: Copy repo to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH_EDU }}
        run: |
          rsync -avz \
            -e "ssh -p ${VPS_PORT} -o StrictHostKeyChecking=accept-new" \
            backend/ frontend/ ai-service/ mcp-server/ infrastructure/ \
            "${VPS_USER}@${VPS_HOST}:${VPS_DEPLOY_PATH}/"

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH_EDU }}
        run: |
          ssh -p "${VPS_PORT}" -o StrictHostKeyChecking=accept-new "${VPS_USER}@${VPS_HOST}" \
            "cd ${VPS_DEPLOY_PATH}/infrastructure && \
             if [ ! -f .env.prod ]; then cp .env.prod.example .env.prod; fi && \
             docker compose --env-file .env.prod -f docker-compose.prod-internal.yml up -d --build"
