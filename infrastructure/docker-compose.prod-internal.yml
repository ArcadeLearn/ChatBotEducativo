name: chatbot-educativo-internal

services:
  edu-app:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.edu-app
      args:
        NEXT_PUBLIC_EDU_BASE_PATH: /edu-chat
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://iecacampus.arcadevs.cloud/api/edu-chat-proxy}
    container_name: edu-app
    restart: always
    env_file:
      - ./.env.prod
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-4001}
      - AI_PORT=${AI_PORT:-8001}
      - MCP_PORT=${MCP_PORT:-8002}
      - FRONTEND_PORT=${FRONTEND_PORT:-3001}
      - HOSTNAME=0.0.0.0
      # Next.js route /api/chat → Nest en el mismo contenedor (no URL pública)
      - API_URL_INTERNAL=${API_URL_INTERNAL:-http://127.0.0.1:4001}
    volumes:
      - ../mcp-server/data:/app/mcp-server/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4001/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 45s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - n8n_default

networks:
  n8n_default:
    external: true
